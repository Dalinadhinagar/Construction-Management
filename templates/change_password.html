{% extends "base.html" %}
{% block title %}Change password{% endblock %}{% block section %}Change password{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change your password</h1><p>Confirm your current password before setting a new one.</p></div></div>
<section class="panel password-panel"><form method="post" class="form-stack"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><div class="form-actions"><button class="button button-primary" type="submit">Update password</button><a class="button button-secondary" href="{{ url_for('dashboard') }}">Cancel</a></div></form></section>
{% endblock %}
